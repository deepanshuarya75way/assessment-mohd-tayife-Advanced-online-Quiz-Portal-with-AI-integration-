<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Category</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a, #111827, #1e3a8a);
    color: #fff;
    min-height: 100vh;
    padding: 30px;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

body::before {
    content: '';
    position: fixed;
    width: 420px;
    height: 420px;
    background: #2563eb;
    filter: blur(170px);
    top: -140px;
    left: -140px;
    opacity: .28;
    z-index: -1;
}

body::after {
    content: '';
    position: fixed;
    width: 420px;
    height: 420px;
    background: #9333ea;
    filter: blur(170px);
    right: -140px;
    bottom: -140px;
    opacity: .22;
    z-index: -1;
}

.container {
    width: 100%;
    max-width: 600px;
    background: rgba(255, 255, 255, .08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 15px 40px rgba(0, 0, 0, .35);
    border-radius: 24px;
    padding: 40px;
    text-align: center;
}

.header-icon {
    width: 70px;
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 20px;
    background: linear-gradient(135deg, #2563eb, #06b6d4);
    font-size: 32px;
    margin: 0 auto 20px;
}

h2 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 10px;
}

.subtitle {
    color: #cbd5e1;
    font-size: 15px;
    margin-bottom: 30px;
}

.category-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: white;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .10);
    padding: 18px 25px;
    margin-bottom: 15px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 500;
    transition: .25s;
}

.category-btn:hover {
    transform: translateY(-2px);
    border-color: #3b82f6;
    background: rgba(59, 130, 246, .15);
    box-shadow: 0 8px 20px rgba(37, 99, 235, .2);
}

.category-btn i {
    font-size: 22px;
    color: #60a5fa;
}

.action-buttons {
    margin-top: 35px;
    padding-top: 25px;
    border-top: 1px solid rgba(255, 255, 255, .10);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    transition: .25s;
}

.btn-home {
    background: #334155;
    color: white;
}
.btn-home:hover { background: #3e4c63; transform: translateY(-2px); }

.btn-leaderboard {
    background: #f59e0b;
    color: #111827;
}
.btn-leaderboard:hover { background: #d97706; transform: translateY(-2px); }

.btn-logout {
    background: transparent;
    border: 1px solid rgba(239, 68, 68, .5);
    color: #fca5a5;
}
.btn-logout:hover { background: rgba(239, 68, 68, .1); }

</style>
</head>
<body>

<div class="container">
    <div class="header-icon">
        <i class="bi bi-collection-fill"></i>
    </div>
    <h2>Welcome, {{ username }}</h2>
    <p class="subtitle">Select a category to begin your assessment.</p>

    <a class="category-btn" href="/take_quiz/Python">
        <span><i class="bi bi-filetype-py"></i> &nbsp; Python</span>
        <i class="bi bi-arrow-right"></i>
    </a>
    <a class="category-btn" href="/take_quiz/Java">
        <span><i class="bi bi-cup-hot-fill"></i> &nbsp; Java</span>
        <i class="bi bi-arrow-right"></i>
    </a>
    <a class="category-btn" href="/take_quiz/PHP">
        <span><i class="bi bi-code-slash"></i> &nbsp; PHP</span>
        <i class="bi bi-arrow-right"></i>
    </a>
    <a class="category-btn" href="/take_quiz/DBMS">
        <span><i class="bi bi-database-fill"></i> &nbsp; DBMS</span>
        <i class="bi bi-arrow-right"></i>
    </a>
    <a class="category-btn" href="/take_quiz/C Programming">
        <span><i class="bi bi-terminal-fill"></i> &nbsp; C Programming</span>
        <i class="bi bi-arrow-right"></i>
    </a>

    <div class="action-buttons">
        <a href="/" class="action-btn btn-home">
            <i class="bi bi-house-door-fill"></i> Back to Home
        </a>
        <a href="/all_leaderboards" class="action-btn btn-leaderboard">
            <i class="bi bi-trophy-fill"></i> View All Leaderboards
        </a>
        <a href="/logout" class="action-btn btn-logout">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>
</div>

</body>
</html>
