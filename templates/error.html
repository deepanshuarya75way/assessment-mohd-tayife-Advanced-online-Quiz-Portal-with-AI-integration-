<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error - Online Quiz Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background: linear-gradient(135deg,#0f172a,#111827,#1e3a8a); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 30px; color: white; text-align: center; }
body::before { content: ''; position: fixed; width: 430px; height: 430px; background: #ef4444; filter: blur(170px); top: -150px; left: -150px; opacity: .20; z-index: -1; }
body::after { content: ''; position: fixed; width: 420px; height: 420px; background: #9333ea; filter: blur(170px); right: -150px; bottom: -150px; opacity: .20; z-index: -1; }
.container { max-width: 500px; }
.error-code { font-size: 80px; font-weight: 700; color: #ef4444; margin-bottom: 10px; line-height: 1; }
h1 { font-size: 28px; margin-bottom: 15px; }
p { font-size: 16px; color: #cbd5e1; margin-bottom: 30px; }
.btn { display: inline-block; padding: 14px 28px; background: linear-gradient(135deg, #2563eb, #06b6d4); color: white; text-decoration: none; border-radius: 12px; font-weight: 600; transition: .3s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<div class="container">
    <div class="error-code">{{ error_code }}</div>
    <h1>Oops! Something went wrong.</h1>
    <p>{{ message }}</p>
    <a href="/" class="btn">⬅️ Return to Home</a>
</div>

</body>
</html>
