<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Category Leaderboards</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

min-height:100vh;

background:
linear-gradient(135deg,#0f172a,#111827,#1e3a8a);

display:flex;
justify-content:center;
align-items:center;

padding:30px;

color:white;

overflow-x:hidden;

}

body::before{

content:'';

position:fixed;

width:450px;
height:450px;

background:#2563eb;

filter:blur(170px);

top:-150px;
left:-150px;

opacity:.30;

z-index:-1;

}

body::after{

content:'';

position:fixed;

width:420px;
height:420px;

background:#9333ea;

filter:blur(170px);

bottom:-150px;
right:-150px;

opacity:.22;

z-index:-1;

}

.container{

width:100%;
max-width:760px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.12);

border-radius:24px;

padding:45px;

box-shadow:0 20px 45px rgba(0,0,0,.35);

}

.header{

text-align:center;

margin-bottom:35px;

}

.logo{

width:90px;
height:90px;

margin:auto;

border-radius:50%;

display:flex;

justify-content:center;
align-items:center;

background:linear-gradient(135deg,#2563eb,#06b6d4);

font-size:40px;

margin-bottom:20px;

}

.logo i{

color:white;

}

.header h1{

font-size:34px;

font-weight:600;

margin-bottom:12px;

}

.header p{

color:#cbd5e1;

font-size:16px;

}

.list{

display:flex;

flex-direction:column;

gap:18px;

margin-top:35px;

}

.btn{

display:flex;

justify-content:space-between;

align-items:center;

text-decoration:none;

padding:18px 22px;

border-radius:16px;

color:white;

font-weight:500;

transition:.30s;

font-size:17px;

border:1px solid rgba(255,255,255,.08);

}

.btn:hover{

transform:translateY(-4px);

box-shadow:0 15px 35px rgba(0,0,0,.35);

}

.left{

display:flex;

align-items:center;

gap:14px;

}

.left i{

font-size:22px;

}

.arrow{

font-size:20px;

opacity:.8;

}

.python{

background:linear-gradient(135deg,#3776AB,#4F9EDC);

}

.java{

background:linear-gradient(135deg,#f59e0b,#f97316);

}

.php{

background:linear-gradient(135deg,#777BB4,#6366F1);

}

.dbms{

background:linear-gradient(135deg,#10b981,#14b8a6);

}

.cprog{

background:linear-gradient(135deg,#475569,#64748b);

}

.home{

margin-top:30px;

background:linear-gradient(135deg,#334155,#475569);

}

.footer{

text-align:center;

margin-top:35px;

font-size:14px;

color:#94a3b8;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">

<i class="bi bi-trophy-fill"></i>

</div>

<h1>

Category Leaderboards

</h1>

<p>

View rankings, monitor performance and compare scores across quiz categories.

</p>

</div>

<div class="list">

<a class="btn python" href="/leaderboard/Python">

<div class="left">

<i class="bi bi-filetype-py"></i>

<span>Python Leaderboard</span>

</div>

<i class="bi bi-chevron-right arrow"></i>

</a>

<a class="btn java" href="/leaderboard/Java">

<div class="left">

<i class="bi bi-cup-hot-fill"></i>

<span>Java Leaderboard</span>

</div>

<i class="bi bi-chevron-right arrow"></i>

</a>

<a class="btn php" href="/leaderboard/PHP">

<div class="left">

<i class="bi bi-code-square"></i>

<span>PHP Leaderboard</span>

</div>

<i class="bi bi-chevron-right arrow"></i>

</a>

<a class="btn dbms" href="/leaderboard/DBMS">

<div class="left">

<i class="bi bi-database-fill"></i>

<span>DBMS Leaderboard</span>

</div>

<i class="bi bi-chevron-right arrow"></i>

</a>

<a class="btn cprog" href="/leaderboard/C Programming">

<div class="left">

<i class="bi bi-terminal-fill"></i>

<span>C Programming Leaderboard</span>

</div>

<i class="bi bi-chevron-right arrow"></i>

</a>

<a class="btn home" href="/">

<div class="left">

<i class="bi bi-house-door-fill"></i>

<span>Back to Dashboard</span>

</div>

<i class="bi bi-arrow-left-circle"></i>

</a>

</div>

<div class="footer">

Online Quiz Portal • Performance Rankings

</div>

</div>

</body>

</html>
